name: voxlab
description: Gamified public speaking learning app (VoxLab style)
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local Storage
  flutter_secure_storage: ^9.2.4

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  record: ^7.1.2
  permission_handler: ^13.0.2
  audioplayers: ^6.8.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/voxi_awake.png
    - assets/images/voxi_sleeping.png
    - assets/images/voxi_logo.png
    - assets/images/voxi_sleepy.png
    - assets/images/voxi_bored.png
    - assets/images/voxi_idle.png
    - assets/images/voxi_angry.png
    - assets/images/voxi_thinking.png
    - assets/images/voxi_love.png
    - assets/images/voxi_shy.png
    - assets/images/voxi_laugh.png
    - assets/images/voxi_singing.png
    - assets/sounds/
    - assets/music/
  fonts:
    # Bundled so google_fonts finds them in the asset manifest instead of
    # fetching at runtime (offline-first + deterministic golden tests).
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/DMSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/DMSans-Black.ttf
          weight: 900